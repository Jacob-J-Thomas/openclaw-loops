name: Verify plugin
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['24.16.0', '26.1.0']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify mounted Editor Advanced lifecycle
        if: runner.os == 'Linux' && matrix.node == '24.16.0'
        run: |
          npx playwright-core install --with-deps chromium
          node scripts/verify-editor.mjs
        env:
          LOOPS_EVIDENCE_DIR: evidence/ci
      - name: Verify extracted publication artifact
        run: node scripts/verify-package.mjs
        env:
          LOOPS_EVIDENCE_DIR: evidence/ci
      - name: Verify ordinary package lifecycle
        run: |
          # Accepted #63 baseline; it predates the packaged #149/#64/#65 changes.
          base_ref="7b2705bc2068f09e68e738ae199889feb69c1680"
          git fetch --no-tags --depth=1 origin "$base_ref"
          previous_dir="$(mktemp -d)"
          trap 'rm -rf "$previous_dir"' EXIT
          git archive "$base_ref" | tar -x -C "$previous_dir"
          (
            cd "$previous_dir"
            npm ci
            npm run build
            npm pack --json > package-lifecycle-pack.json
          )
          previous_archive="$previous_dir/$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(process.argv[1]))[0].filename)' "$previous_dir/package-lifecycle-pack.json")"
          current_archive="$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync("evidence/ci/package.json")).filename)')"
          LOOPS_LIFECYCLE_PREVIOUS_REF="$base_ref" \
            LOOPS_LIFECYCLE_PREVIOUS_HOST_ROOT="$previous_dir" \
            LOOPS_LIFECYCLE_EXPECTED_PREVIOUS_HOST_VERSION="2026.9.3" \
            LOOPS_LIFECYCLE_EXPECTED_CURRENT_HOST_VERSION="2026.9.5" \
            node scripts/verify-package-lifecycle.mjs "$previous_archive" "$current_archive"
        env:
          LOOPS_EVIDENCE_DIR: evidence/ci
      - name: Verify sustained public Gateway workload
        run: |
          current_archive="$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync("evidence/ci/package.json")).filename)')"
          node scripts/verify-sustained-workload.mjs "$current_archive"
        env:
          LOOPS_EVIDENCE_DIR: evidence/ci
      - name: Verify recovery from a full filesystem
        if: runner.os == 'Linux'
        run: |
          loop_fault_dir=$(mktemp -d)
          trap 'sudo umount "$loop_fault_dir"; rmdir "$loop_fault_dir"' EXIT
          sudo mount -t tmpfs -o size=16m,mode=0777 tmpfs "$loop_fault_dir"
          node scripts/verify-filesystem-full.mjs "$loop_fault_dir" evidence/ci/filesystem-full.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: plugin-${{ matrix.os }}-node-${{ matrix.node }}
          if-no-files-found: error
          path: |
            *.tgz
            evidence/ci/*.json
            evidence/ci/package-lifecycle/receipt.json
            evidence/ci/sustained-workload/receipt.json
          retention-days: 14
