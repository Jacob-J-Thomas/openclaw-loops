name: Verify plugin
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['24.16.0', '26.1.0']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify extracted publication artifact
        run: node scripts/verify-package.mjs
        env:
          LOOPS_EVIDENCE_DIR: evidence/ci
      - name: Verify recovery from a full filesystem
        if: runner.os == 'Linux'
        run: |
          loop_fault_dir=$(mktemp -d)
          trap 'sudo umount "$loop_fault_dir"; rmdir "$loop_fault_dir"' EXIT
          sudo mount -t tmpfs -o size=16m,mode=0777 tmpfs "$loop_fault_dir"
          node scripts/verify-filesystem-full.mjs "$loop_fault_dir" evidence/ci/filesystem-full.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: plugin-${{ matrix.os }}-node-${{ matrix.node }}
          if-no-files-found: error
          path: |
            *.tgz
            evidence/ci/*.json
          retention-days: 14
